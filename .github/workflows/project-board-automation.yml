name: Project Board Automation

on:
  pull_request:
    types: [review_requested, closed]

env:
  PROJECT_NUMBER: "2"
  ORGANIZATION: "mskth-webpage"
  REVIEW_COLUMN: "Review"
  DONE_COLUMN: "Done"

jobs:
  move-to-review:
    name: "Move to Review"
    runs-on: ubuntu-latest
    if: github.event.action == 'review_requested'
    steps:
      - name: Move linked issues to Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const org = process.env.ORGANIZATION;
            const projectNumber = parseInt(process.env.PROJECT_NUMBER);
            const targetColumn = process.env.REVIEW_COLUMN;

            const prBody = context.payload.pull_request.body || '';
            const prBranch = context.payload.pull_request.head.ref || '';

            const issueNumbers = new Set();

            const bodyMatches = prBody.matchAll(
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi
            );
            for (const match of bodyMatches) issueNumbers.add(parseInt(match[1]));

            const branchMatches = prBranch.matchAll(/(?:^|[/-])(\d+)(?:[/-]|$)/g);
            for (const match of branchMatches) issueNumbers.add(parseInt(match[1]));

            const hashMatches = prBody.matchAll(/#(\d+)/g);
            for (const match of hashMatches) issueNumbers.add(parseInt(match[1]));

            if (issueNumbers.size === 0) {
              console.log('No linked issues found.');
              return;
            }

            console.log('Found linked issues: ' + [...issueNumbers].join(', '));

            const projectQuery = `
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectResult = await github.graphql(projectQuery, { org, number: projectNumber });
            const project = projectResult.organization.projectV2;
            const statusField = project.fields.nodes.find(f => f.name === 'Status');

            if (!statusField) { core.setFailed('Could not find "Status" field.'); return; }

            const targetOption = statusField.options.find(o => o.name === targetColumn);
            if (!targetOption) { core.setFailed('Could not find "' + targetColumn + '" option.'); return; }

            const itemQuery = `
              query($projectId: ID!, $cursor: String) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100, after: $cursor) {
                      nodes { id content { ... on Issue { number } } }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }
            `;

            for (const issueNumber of issueNumbers) {
              try {
                await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber });

                let projectItemId = null, cursor = null;
                while (true) {
                  const items = await github.graphql(itemQuery, { projectId: project.id, cursor });
                  const item = items.node.items.nodes.find(i => i.content?.number === issueNumber);
                  if (item) { projectItemId = item.id; break; }
                  if (!items.node.items.pageInfo.hasNextPage) break;
                  cursor = items.node.items.pageInfo.endCursor;
                }

                if (!projectItemId) { console.log('Issue #' + issueNumber + ' not found in project.'); continue; }

                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId itemId: $itemId fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }) { projectV2Item { id } }
                  }
                `, { projectId: project.id, itemId: projectItemId, fieldId: statusField.id, optionId: targetOption.id });

                console.log('Issue #' + issueNumber + ' moved to "' + targetColumn + '"');
              } catch (error) {
                console.log('Failed to move issue #' + issueNumber + ': ' + error.message);
              }
            }

  move-to-done:
    name: "Move to Done"
    runs-on: ubuntu-latest
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'dev'
    steps:
      - name: Move linked issues to Done
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const org = process.env.ORGANIZATION;
            const projectNumber = parseInt(process.env.PROJECT_NUMBER);
            const targetColumn = process.env.DONE_COLUMN;

            const prBody = context.payload.pull_request.body || '';
            const prBranch = context.payload.pull_request.head.ref || '';

            const issueNumbers = new Set();

            const bodyMatches = prBody.matchAll(
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi
            );
            for (const match of bodyMatches) {
              issueNumbers.add(parseInt(match[1]));
            }

            const branchMatches = prBranch.matchAll(/(?:^|[/-])(\d+)(?:[/-]|$)/g);
            for (const match of branchMatches) {
              issueNumbers.add(parseInt(match[1]));
            }

            const hashMatches = prBody.matchAll(/#(\d+)/g);
            for (const match of hashMatches) {
              issueNumbers.add(parseInt(match[1]));
            }

            if (issueNumbers.size === 0) {
              console.log('No linked issues found.');
              return;
            }

            console.log('Found linked issues: ' + [...issueNumbers].join(', '));

            const projectQuery = `
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectResult = await github.graphql(projectQuery, {
              org: org,
              number: projectNumber
            });

            const project = projectResult.organization.projectV2;
            const statusField = project.fields.nodes.find(f => f.name === 'Status');

            if (!statusField) {
              core.setFailed('Could not find "Status" field.');
              return;
            }

            const targetOption = statusField.options.find(o => o.name === targetColumn);
            if (!targetOption) {
              core.setFailed('Could not find "' + targetColumn + '" option.');
              return;
            }

            for (const issueNumber of issueNumbers) {
              try {
                const issueResult = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });

                const itemQuery = `
                  query($projectId: ID!, $cursor: String) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        items(first: 100, after: $cursor) {
                          nodes {
                            id
                            content {
                              ... on Issue {
                                number
                              }
                            }
                          }
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                        }
                      }
                    }
                  }
                `;

                let projectItemId = null;
                let cursor = null;

                while (true) {
                  const items = await github.graphql(itemQuery, {
                    projectId: project.id,
                    cursor: cursor
                  });

                  const item = items.node.items.nodes.find(
                    i => i.content && i.content.number === issueNumber
                  );

                  if (item) {
                    projectItemId = item.id;
                    break;
                  }

                  if (!items.node.items.pageInfo.hasNextPage) break;
                  cursor = items.node.items.pageInfo.endCursor;
                }

                if (!projectItemId) {
                  console.log('Issue #' + issueNumber + ' not found in project.');
                  continue;
                }

                const mutation = `
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }) {
                      projectV2Item { id }
                    }
                  }
                `;

                await github.graphql(mutation, {
                  projectId: project.id,
                  itemId: projectItemId,
                  fieldId: statusField.id,
                  optionId: targetOption.id
                });

                console.log('Issue #' + issueNumber + ' moved to "' + targetColumn + '"');
              } catch (error) {
                console.log('Failed to move issue #' + issueNumber + ': ' + error.message);
              }
            }
